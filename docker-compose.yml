name: llm-resilience-chatbot

services:
  backend:
    build: ./backend
    container_name: llm-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CACHE_DIR: /data/llm_cache
    volumes:
      - llm_appdata:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: llm-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  llm_appdata:
