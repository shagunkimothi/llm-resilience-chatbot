# Netlify: set the site's base directory to "frontend" and define VITE_API_URL
# (the Railway backend URL) in Site settings -> Environment variables; it is read at build time.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
